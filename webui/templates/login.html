<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Please login</h1>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form action="/login" method="post">
        <label>Password:</label>
        <input type="password" name="password" />
        <button type="submit">Login</button>
    </form>
</body>
</html>
